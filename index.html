@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#1A1612; --surface:#241E19; --ink:#F4EEE4; --muted:#B3A798; --line:#3A3027;
  --accent:#E58A6E; --accent-ink:#1F120C; --accent-soft:#3A2820;
  --ok:#5FCB8A; --warn:#E8A951; --crit:#F08A82; --band:#120F0C; --band-ink:#F4EEE4; --band-accent:#E58A6E; color-scheme:dark; } }
:root[data-theme="dark"] {
  --bg:#1A1612; --surface:#241E19; --ink:#F4EEE4; --muted:#B3A798; --line:#3A3027;
  --accent:#E58A6E; --accent-ink:#1F120C; --accent-soft:#3A2820;
  --ok:#5FCB8A; --warn:#E8A951; --crit:#F08A82; --band:#120F0C; --band-ink:#F4EEE4; --band-accent:#E58A6E; color-scheme:dark; }

* { box-sizing:border-box; }
html { padding-top:env(safe-area-inset-top,0px); }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 var(--body); padding-block:0 28px;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); }
body.tabs { padding-bottom:92px; }
h1,h2,h3 { font-family:var(--display); margin:0; line-height:1.2; text-wrap:balance; }
h1 { font-size:26px; } h2 { font-size:20px; } h3 { font-size:16px; }
p { margin:0; }
button,input,select,textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.wrap { max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:14px; padding-block:14px; }
.muted { color:var(--muted); } .small { font-size:13px; } .mono { font-family:var(--mono); }
.label { font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }

.top { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; padding-block:10px 0; max-width:720px; margin:0 auto; }
.brand { display:flex; align-items:center; gap:10px; }
.logo { width:34px; height:34px; border-radius:9px; overflow:hidden; display:block; }
.logo svg { width:100%; height:100%; display:block; }
.pride { flex-basis:100%; height:5px; border-radius:3px; background:linear-gradient(90deg,#E40303 0 16.6%,#FF8C00 0 33.3%,#FFED00 0 50%,#008026 0 66.6%,#004DFF 0 83.3%,#750787 0); }
.brand b { font-family:var(--display); font-size:17px; }
.modebar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

.card { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:12px; min-width:0; }
.card.inner { background:var(--bg); }
.hero { background:var(--band); color:var(--band-ink); border-radius:16px; padding:20px; display:flex; flex-direction:column; gap:10px; }
.hero.photo { background-image:linear-gradient(rgba(43,38,33,.50),rgba(43,38,33,.86)), var(--p-crowd); background-size:cover; background-position:center 30%; min-height:200px; justify-content:flex-end; color:#F4EEE4; }
.hero.photo h1 { color:#fff; }
.choice .pic { display:block; height:104px; border-radius:10px; background:var(--p-houses) center 40%/cover; margin-bottom:8px; }
.hero .big { font-family:var(--display); font-size:40px; line-height:1; color:var(--band-accent); }
.row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.between { justify-content:space-between; }
.grow { flex:1; min-width:0; }
.stack { display:flex; flex-direction:column; gap:10px; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.stat { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
.stat b { font-family:var(--display); font-size:24px; display:block; line-height:1.1; font-variant-numeric:tabular-nums; }
.stat span { font-size:12px; color:var(--muted); }
@media (max-width:520px) { .grid2 { grid-template-columns:1fr; } .stats { grid-template-columns:repeat(2,1fr); } }

.choice { display:flex; flex-direction:column; gap:6px; text-align:left; width:100%; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px; }
.choice:hover { border-color:var(--accent); }
.choice h2 { color:var(--ink); }
.choice .go { color:var(--accent); font-weight:600; font-size:14px; }

.btn { background:var(--accent); color:var(--accent-ink); border:0; border-radius:10px; padding:10px 16px; font-weight:600; min-height:42px; }
.btn.ghost { background:transparent; color:var(--accent); border:1px solid var(--line); }
.btn.danger { background:transparent; color:var(--crit); border:1px solid var(--line); }
.btn.sm { padding:5px 11px; min-height:32px; font-size:13px; border-radius:8px; }
.btn[disabled] { opacity:.5; cursor:default; }
.link { background:none; border:0; color:var(--accent); font-weight:600; padding:4px 0; }
.field { display:flex; flex-direction:column; gap:4px; }
.field label { font-size:13px; font-weight:600; }
.input { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:9px 12px; min-height:42px; width:100%; }
textarea.input { min-height:84px; resize:vertical; }
.pill { display:inline-block; font-size:12px; font-weight:600; padding:2px 9px; border-radius:99px; background:var(--accent-soft); color:var(--accent); white-space:nowrap; }
.pill.ok { background:color-mix(in srgb,var(--ok) 16%,transparent); color:var(--ok); }
.pill.warn { background:color-mix(in srgb,var(--warn) 16%,transparent); color:var(--warn); }
.pill.crit { background:color-mix(in srgb,var(--crit) 16%,transparent); color:var(--crit); }
.pill.idle { background:color-mix(in srgb,var(--muted) 16%,transparent); color:var(--muted); }
.seg { display:flex; gap:8px; flex-wrap:wrap; }
.chip { border:1px solid var(--line); background:var(--surface); border-radius:99px; padding:7px 14px; font-weight:600; font-size:13px; }
.chip.on { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.meter { height:8px; border-radius:8px; background:var(--line); overflow:hidden; }
.meter b { display:block; height:100%; background:var(--accent); }
.banner { border-radius:12px; padding:10px 14px; font-size:13px; background:var(--accent-soft); border:1px solid var(--line); }
.banner.warn { background:color-mix(in srgb,var(--warn) 14%,var(--surface)); }
.err { color:var(--crit); font-size:14px; }
.demo { font-family:var(--mono); background:var(--bg); border:1px dashed var(--accent); border-radius:10px; padding:10px 12px; font-size:14px; }
.switch { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.switch input { width:22px; height:22px; accent-color:var(--accent); flex:none; }

.check { display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--line); }
.check:first-of-type { border-top:0; }
.tick { width:24px; height:24px; border-radius:50%; border:2px solid var(--line); flex:none; display:grid; place-items:center; }
.tick.done { background:var(--ok); border-color:var(--ok); }
.tick svg { width:14px; height:14px; stroke:#fff; fill:none; stroke-width:3; display:none; stroke-linecap:round; stroke-linejoin:round; }
.tick.done svg { display:block; }

.tabbar { position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--line); display:flex; justify-content:center;
  padding:6px max(8px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px, env(safe-area-inset-left,0px)); z-index:20; }
.tabbar div { display:flex; width:100%; max-width:720px; }
.tabbar button { flex:1; background:none; border:0; padding:6px 2px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11px; font-weight:600; color:var(--muted); border-radius:10px; }
.tabbar button svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.tabbar button.on { color:var(--accent); }
.stabs { display:flex; gap:4px; overflow-x:auto; border-bottom:1px solid var(--line); }
.stabs button { background:none; border:0; border-bottom:3px solid transparent; padding:10px 12px; font-weight:600; color:var(--muted); white-space:nowrap; }
.stabs button.on { color:var(--accent); border-bottom-color:var(--accent); }
.q { border:1px solid var(--line); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:8px; }
.kv { display:grid; grid-template-columns:120px 1fr; gap:4px 12px; font-size:14px; margin:0; }
.kv dt { color:var(--muted); } .kv dd { margin:0; min-width:0; overflow-wrap:anywhere; }
.toastbox { position:fixed; left:0; right:0; bottom:calc(92px + env(safe-area-inset-bottom,0px)); display:flex; justify-content:center; pointer-events:none; z-index:30; padding:0 16px; }
.toast { background:var(--band); color:var(--band-ink); padding:10px 16px; border-radius:12px; font-size:14px; max-width:480px; box-shadow:0 6px 24px rgba(0,0,0,.25); }
.msgs { display:flex; flex-direction:column; gap:6px; }
.msg { max-width:88%; padding:8px 12px; border-radius:12px; background:var(--surface); border:1px solid var(--line); font-size:14px; overflow-wrap:anywhere; }
.msg.me { align-self:flex-end; background:var(--accent-soft); }
.tlist { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; font-size:13px; }
.scroll { overflow-x:auto; }
.table { width:100%; border-collapse:collapse; font-size:14px; }
.table th { text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
.table td { padding:10px; border-bottom:1px solid var(--line); vertical-align:top; }
#app:focus { outline:none; }
.skip { position:absolute; left:-999px; top:0; background:var(--accent); color:var(--accent-ink); padding:8px 14px; border-radius:0 0 8px 8px; z-index:50; }
.skip:focus { left:16px; }
hr { border:0; border-top:1px solid var(--line); width:100%; margin:0; }
body.lg { font-size:17.5px; } body.lg .small { font-size:15px; } body.lg .btn.sm { min-height:40px; font-size:15px; } body.lg .chip { font-size:15px; } body.lg .pill { font-size:13px; }
.badge { background:var(--crit); color:#fff; border-radius:99px; font-size:10px; font-weight:700; min-width:16px; height:16px; padding:0 4px; display:inline-grid; place-items:center; margin-left:4px; }
.tabbar button { position:relative; } .tabbar .badge { position:absolute; top:0; left:calc(50% + 6px); margin:0; }
.crisis { border:1px solid var(--crit); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:8px; background:color-mix(in srgb,var(--crit) 8%,var(--surface)); }
.qr { display:flex; gap:6px; flex-wrap:wrap; } .qr .chip { font-size:12px; padding:5px 10px; text-align:left; }
details > summary { cursor:pointer; font-weight:600; } details + details { border-top:1px solid var(--line); padding-top:8px; }
